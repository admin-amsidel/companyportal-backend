# Tests use an in-memory database instead of the live Supabase one (a fresh one per Spring test context)
spring.datasource.url=jdbc:h2:mem:companyportal-${random.uuid};MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=create-drop
# the migrations are PostgreSQL scripts: the in-memory H2 database is made from the entities instead (FlywayMigrationTest
# checks the scripts themselves)
spring.flyway.enabled=false
# H2 has no lock_timeout setting (the live PostgreSQL one is in application.properties)
spring.datasource.hikari.connection-init-sql=SELECT 1
# Check-in photos go to a temp folder per test context (AttendanceTest empties its own first)
app.attendance.photo-dir=${java.io.tmpdir}/companyportal-test-photos/${test.context:shared}
app.documents.dir=${java.io.tmpdir}/companyportal-test-documents/${test.context:shared}
# Tests sign in with this first owner PIN, whatever the default in application.properties is
app.bootstrap.owner.password=Ams@2026

# tests call /api/chat/sync back to back
app.chat.min-sync-gap-ms=0
# no job timers in tests, which call the jobs themselves: SchedulerCronTest turns them on
app.schedulers.auto-start=false
# the tests were written with the first brand as DW
app.bootstrap.brand.code=DW
app.bootstrap.brand.name=Acme Doors & Windows
# the product types the trade tests expect on the first brand
app.bootstrap.product-types=UPVC:uPVC Doors & Windows,ALU:Aluminium Doors & Windows,WPC:WPC Doors & Windows,STEEL:Steel Doors & Windows,SAFETY:Safety Doors,ABS:ABS Doors,MEMBRANE:Membrane Doors,LAMINATED:Laminated Doors,SKIN:Skin Doors,FRP:Fibre (FRP) Doors,WOOD:Wood,PLYWOOD:Plywood
# the mail tests expect an office copy on every mail
app.mail.always-cc=info@example.com

spring.application.name=companyportal-backend
# Local secrets kept out of git (e.g. the mail key): secrets.properties next to pom.xml, if present
spring.config.import=optional:file:./secrets.properties
server.port=${PORT:8080}

# --- Web server limits: fit the small cloud instance (512 MB, 0.1-1 CPU) instead of Tomcat's 200 threads ---
# Each thread costs memory (its stack) and a turn on the CPU; 200 of them waiting on sign-ins is what ran the free
# instance out of memory under load (502s until Render restarted it). Requests past these wait in the accept queue,
# and past that are refused at once. On a 2 GB / 1+ CPU plan TOMCAT_THREADS=80 is fine.
server.tomcat.threads.max=${TOMCAT_THREADS:40}
server.tomcat.threads.min-spare=5
server.tomcat.accept-count=${TOMCAT_ACCEPT_COUNT:100}
server.tomcat.connection-timeout=10s

# --- PostgreSQL ---
# TODO (production): set DB_URL, DB_USERNAME and DB_PASSWORD for the production database (e.g. a Supabase session
# pooler: jdbc:postgresql://<pooler-host>:5432/postgres?sslmode=require). The defaults are a local PostgreSQL
# database called companyportal.
spring.datasource.url=${DB_URL:jdbc:postgresql://aws-0-ap-northeast-1.pooler.supabase.com:5432/postgres?sslmode=require}
spring.datasource.username=${DB_USERNAME:postgres.vbkcydezouaqgekdqgrp}
# The password is not kept here: locally it comes from secrets.properties, in production from DB_PASSWORD
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

# Pool size: every API call holds a connection while it runs, and the database is ~200-300 ms away (Tokyo), so
# with 5 a burst of page loads (the office opening the portal at 9:00, parallel tests) queued for >10 s.
# 10 stays inside the Supabase session pooler's pool (15 on the free tier), leaving room for the SQL editor and
# tools; DB_POOL_SIZE changes it. More needs the transaction pooler (port 6543) or a bigger plan.
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:10}
# Keep these open and warm: opening a new SSL connection costs about a second, which a page making several calls
# at once would otherwise pay on every visit; the rest open under load and close again after idle-timeout
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:2}
spring.datasource.hikari.connection-timeout=20000
# Recycle each connection after 1 hour (only when idle, never mid-query)
spring.datasource.hikari.max-lifetime=3600000
# Ping idle connections every 5 minutes so the network/pooler doesn't drop them silently
spring.datasource.hikari.keepalive-time=300000
# Wait at most 5 s for a row another transaction has locked (e.g. an uncommitted change in an SQL tool), then
# fail with "database is busy" instead of hanging until the server's statement timeout
spring.datasource.hikari.connection-init-sql=SET lock_timeout = '5s'

# --- Schema: Flyway (src/main/resources/db/migration) ---
# Flyway makes every schema change, from versioned scripts, before the app starts; Hibernate only checks that the
# tables match the entities (validate) and refuses to start if they do not, instead of changing the database itself.
# A schema change = a new V<n>__what.sql (never edit one that has run). The production database already had the tables
# from ddl-auto=update, so it is recorded as being at V1 (the baseline) the first time and runs V2 onwards.
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.flyway.baseline-description=tables made by ddl-auto=update before Flyway

# --- JPA / Hibernate ---
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:validate}
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# --- Scheduler: read-only product count check (ISO-8601 durations) ---
# false stops every scheduled job on this machine alone, e.g. a developer's machine on the shared database. The
# configurations table stops and starts them on all machines: SCHEDULERS_ENABLED and a SCHEDULER_..._ENABLED row for each job
app.schedulers.enabled=${SCHEDULERS_ENABLED:true}
# When each job runs, as a cron of 6 parts in app.leave.zone: second minute hour day month weekday. These are the fallbacks:
# an active SCHEDULER_..._CRON row in the configurations table wins over them, and a change there applies with no restart.
# The other two jobs' are app.leave.expiry-cron and app.chat.clean-cron.
app.scheduler.product-count.cron=${PRODUCT_COUNT_CRON:0 */5 * * * *}
app.scheduler.session-check.cron=${SESSION_CHECK_CRON:0 */5 * * * *}
app.scheduler.chat-report.cron=${CHAT_REPORT_CRON:0 0 * * * *}
# Storage figures (Storage page and Overview): measured three times a day, every 8 hours (00:00, 08:00, 16:00 India time)
app.scheduler.storage.cron=${STORAGE_CRON:0 0 0/8 * * *}

# --- Actuator ---
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always
# Mail is optional (and has its own "not set up" message in the portal): its state must not mark the app DOWN
management.health.mail.enabled=false

# --- CORS: the web app's addresses ---
# Exact addresses or patterns; https://*.example.com allows every sub-domain (www, portal, ...) but not example.com itself.
# TODO (production): add the production web address(es) through CORS_ORIGINS.
app.cors.allowed-origins=${CORS_ORIGINS:https://amsidel.com,https://*.amsidel.com,https://amsidel-web.info-amsidel.workers.dev,http://localhost:4200}

# --- Employee login (JWT access tokens, HS256) ---
# Signing key: base64, at least 32 bytes. Changing it logs everyone out. Set JWT_SECRET in production.
app.jwt.secret=${JWT_SECRET:Wwqa8OXmIo4gTTJmAJidBjymsEYbpgQTTU2Hfb2/agejWt7CNTqI7e+MfqJjWeQ6}
# How long a login lasts (one working day)
# how long a sign-in lasts, in minutes. This is the fallback: an active SESSION_MAX_MINUTES row in the configurations table
# wins over it, and is read again within a minute of a change
app.session.max-minutes=${SESSION_MAX_MINUTES:360}
app.jwt.issuer=companyportal-backend
# After this many wrong PINs in a row the account locks until an admin sets a temporary PIN (Reset PIN)
app.login.max-failed-attempts=5
# PIN checks running at once: each uses a whole CPU core. 0 follows the server's cores (1 on a 0.1-1 CPU plan, 2 on 2 CPUs):
# more checks than cores only makes every one of them slower.
app.login.max-concurrent-checks=${LOGIN_MAX_CHECKS:0}
# How long a sign-in waits for its turn before being told "busy, try again" (503). Short, so a rush gets a fast answer
# that the portal retries by itself, rather than a 15 s hang that holds a server thread the whole time.
app.login.check-wait=${LOGIN_CHECK_WAIT:PT5S}

# --- First start: created only when the tables are empty ---
# The owner must change this PIN at first login.
app.bootstrap.owner.user-id=${OWNER_USER_ID:owner}
app.bootstrap.owner.password=${OWNER_PASSWORD:Asd@2026}
app.bootstrap.owner.name=Portal Owner
# The first brand (company); more brands are added from the portal (owner only). Rename it on the Brands page.
app.bootstrap.brand.code=${BRAND_CODE:HQ}
app.bootstrap.brand.name=${BRAND_NAME:My Company}
# Product types the first brand starts with, as CODE:Name pairs separated by commas (empty = none; add them on screen)
app.bootstrap.product-types=${PRODUCT_TYPES:}

# --- Uploads ---
# The most the server takes for any one file; a limit below cannot go over this. Staff mail attachments (MailFileStore)
# and bank statements use all of it.
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=11MB
# How large each kind of picture may be, e.g. 2MB or 500KB. The server refuses anything larger, and the portal's checks
# and hints follow these. Restart the backend after changing one.
app.uploads.max-size.profile-photo=2MB
app.uploads.max-size.agent-photo=1MB
app.uploads.max-size.check-in-photo=2MB
app.uploads.max-size.brand-logo=1MB
app.uploads.max-size.upi-qr=2MB
app.uploads.max-size.news-picture=3MB
app.uploads.max-size.project-photo=5MB
# The most the database may hold, as your Supabase plan allows (the database cannot be asked this). Shown as the limit on
# the Storage page; it does not stop anything by itself.
app.database.max-size=${DATABASE_MAX_SIZE:500MB}
# Employee documents: PDF or picture
app.uploads.max-size.document=2MB

# --- Leave ---
# Days not counted as leave (comma-separated, e.g. SATURDAY,SUNDAY)
app.leave.weekly-offs=SUNDAY
# "Today" for leave rules (cancel before start, default year)
app.leave.zone=Asia/Kolkata

# --- Staff mail (owners and admins send personal mail to employees' office addresses) ---
# The default account: a brand can have its own under the Email config screens (one account per brand, stored in
# mail_brand_account), and then only this server and port are shared.
# Sent through Brevo (free plan: about 300 mails a day). The SMTP key (Brevo > SMTP & API > SMTP keys) is given as
# MAIL_PASSWORD and is not kept in the code; until it is set the portal shows mail as not set up.
spring.mail.host=${MAIL_HOST:smtp-relay.brevo.com}
# 2525, not the usual 587: Render's free plan blocks outgoing mail ports 25, 465 and 587 (since Sep 2025).
# Brevo takes the same STARTTLS connection on 2525. On a network that blocks 2525 (some office firewalls, e.g. when
# running locally) set MAIL_PORT=465: that port is SSL from the start, and the connection switches to it by itself
# (MailPortConfig); the starttls lines below then do not apply.
spring.mail.port=${MAIL_PORT:2525}
spring.mail.username=${MAIL_USERNAME:bf6436001@smtp-brevo.com}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.default-encoding=UTF-8
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=20000
spring.mail.properties.mail.smtp.writetimeout=20000
# Sender shown to staff: must be a sender (or on a domain) verified in Brevo > Senders & Domains.
# Use an address on your own domain once it is verified (better for inboxes than a @gmail.com sender).
# notification bell, all in whole minutes. Only people with the Notifications tick check, from their open page; nothing runs
# on the server between checks.
# how often an open page checks; keep it no longer than the lead below, or a "starting soon" can first show once the meeting has begun
app.notifications.poll-minutes=${NOTIFICATION_POLL_MINUTES:5}
# how long before a meeting starts it is notified
app.notifications.meeting-lead-minutes=${NOTIFICATION_LEAD_MINUTES:5}
# a meeting with no end time counts as closed this long after it starts
app.notifications.meeting-default-length-minutes=${NOTIFICATION_MEETING_LENGTH_MINUTES:60}
# a closed meeting nobody cleared still shows for this many days after its date (0 = only on the day)
app.notifications.keep-days=${NOTIFICATION_KEEP_DAYS:1}

# team chat: messages older than this many days are cleared by the daily clean-up (7:00 in app.leave.zone)
app.chat.retention-days=${CHAT_RETENTION_DAYS:7}
app.chat.clean-cron=${CHAT_CLEAN_CRON:0 0 2 * * *}
app.razorpay.api=${RAZORPAY_API:https://api.razorpay.com/v1}
# the company's default Razorpay account, for brands without their own keys (set as environment variables / secrets.properties)
app.razorpay.key-id=${RAZORPAY_KEY_ID:}
app.razorpay.key-secret=${RAZORPAY_KEY_SECRET:}
app.mail.from=${MAIL_FROM:info.amsidel@gmail.com}
app.mail.from-name=${MAIL_FROM_NAME:Company Portal}
# Copied (CC) on every mail the portal sends: staff mail, customer and supplier mail; empty = no copy
app.mail.always-cc=${MAIL_ALWAYS_CC:}
# Website support chat: call-back and demo requests are saved (sales_enquiries) and mailed to these addresses
# (comma separated; empty = saved only). A visitor may send a few an hour, the whole site a few dozen.
app.enquiries.notify-to=${ENQUIRY_NOTIFY_TO:info.amsidel@gmail.com}
app.enquiries.per-visitor-per-hour=${ENQUIRY_PER_VISITOR:5}
app.enquiries.per-hour=${ENQUIRY_PER_HOUR:60}
# The visitor also gets a "we have your request" mail (same design as staff mail); replies go to the first notify-to address
app.enquiries.confirm-visitor=${ENQUIRY_CONFIRM_VISITOR:true}
# Shown in those mails: the band at the top, the team name in the signature, a phone to call (empty = not shown), and
# the portal's address for the "Open in the portal" button in the sales team's mail (empty = no button)
app.enquiries.mail-header=${ENQUIRY_MAIL_HEADER:COMPANY PORTAL}
app.enquiries.company-name=${ENQUIRY_COMPANY_NAME:AMSIDEL Technologies}
app.enquiries.phone=${SALES_PHONE:+91 98745***12}
app.enquiries.portal-url=${PORTAL_URL:https://company-portal.amsidel.com/}

# --- Payslips (PDF and screen): the company shown at the top. Set the address before the first payslip goes out. ---
app.payslip.company-name=${PAYSLIP_COMPANY_NAME:My Company}
app.payslip.company-address=${PAYSLIP_COMPANY_ADDRESS:}

# --- Attendance (check-in / check-out) ---
# "Today" for the once-a-day check-in
app.attendance.zone=${app.leave.zone}
# Location worse than this (metres) is flagged LOW_ACCURACY
app.attendance.low-accuracy-metres=200
# Folder for check-in photos (attendance/{yyyy}/{MM}/{employeeId}/{dd}.jpg below it). Must be a disk that survives
# restarts and deploys (on Render: a persistent disk mounted here, e.g. ATTENDANCE_PHOTO_DIR=/var/data).
app.attendance.photo-dir=${ATTENDANCE_PHOTO_DIR:./data}
# Employee documents (PAN, Aadhaar, bank statement / passbook, offer letter, passport size photo; 2 MB each) are kept in
# the database. This is only the old folder (documents/{employeeId}/{TYPE}-{time}.pdf|jpg|png below it): each start moves
# what is still there into the database, then nothing more is needed from it (see the log, "Employee documents to the database").
app.documents.dir=${EMPLOYEE_DOCS_DIR:./data}

# Travel allowance: Google Maps key for route distances of GPS trips (Directions API). Empty = estimated from the GPS points.
app.maps.google-api-key=${GOOGLE_MAPS_API_KEY:}
# Documents that may be uploaded for a person in a month, unless their employee record has its own limit
app.documents.monthly-upload-limit=${DOCUMENT_MONTHLY_LIMIT:10}

# credits (shown by /actuator/info when exposed)
info.app.name=Company Portal backend
info.app.vendor=AMSIDEL Technologies
info.app.copyright=Copyright (c) 2026 AMSIDEL Technologies. All rights reserved.

# gzip for JSON (the chat window's checks above all): less network and its cost
server.compression.enabled=true
server.compression.mime-types=application/json,text/plain,text/csv
server.compression.min-response-size=1024
# at most about one chat /sync a second per person (429 above it)
app.chat.min-sync-gap-ms=900
# API calls slower than this are logged with the database pool's state (in use, idle, waiting)
app.slow-request-ms=2000
